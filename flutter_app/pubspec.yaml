name: maprisma_manager
description: "Maprisma Settings (formerly Maprisma Manager): install, update and remove the Maprisma apps, their bar icons, and set up the desktop."
publish_to: 'none'
version: 0.11.0+25

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  maprisma_core_kit:
    git:
      url: https://github.com/maprisma/maprisma-kit.git
      ref: 2249436538eff4c0925bfbc007000e3eaf095591 # v0.2.0
      path: packages/maprisma_core_kit
  maprisma_manager_core:
    path: ../packages/maprisma_manager_core
  maprisma_ui:
    git:
      url: https://github.com/maprisma/maprisma-kit.git
      ref: 2249436538eff4c0925bfbc007000e3eaf095591 # v0.2.0
      path: packages/maprisma_ui
  file_selector: ^1.1.0
  flutter_svg: ^2.3.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
